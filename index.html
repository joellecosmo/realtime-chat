
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Realtime Chat</title>
</head>

<body>
    <h1>Realtime Chat</h1>

    <input id="username" placeholder="Your username">
    <button id="connectButton">Connect</button>
    <p id="status">Disconnected</p>

    <hr>

    <input id="recipient" placeholder="Recipient">
    <input id="message" placeholder="Your message">
    <button id="sendButton" disabled>Send</button>

    <h3>Messages</h3>
    <ul id="messages"></ul>

    <script>
        let socket;
        let username;

        const status = document.getElementById("status");
        const sendButton = document.getElementById("sendButton");
        const connectButton = document.getElementById("connectButton");

        connectButton.addEventListener("click", () => {
            // Prevent multiple simultaneous connections
            if (socket && socket.readyState !== WebSocket.CLOSED) {
                return;
            }

            username = document.getElementById("username").value.trim();

            if (!username) {
                alert("Enter a username");
                return;
            }

            connectButton.disabled = true;
            sendButton.disabled = true;
            status.textContent = "Connecting...";

            socket = new WebSocket(`ws://${window.location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({
                    type: "register",
                    username
                }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === "error") {
                    status.textContent = data.message;
                    sendButton.disabled = true;

                    // Close rejected connections
                    socket.close(1000, data.message);
                    return;
                }

                if (data.type === "registered") {
                    status.textContent = `Connected as ${data.username}`;
                    sendButton.disabled = false;
                    return;
                }

                const item = document.createElement("li");
                item.textContent = `${data.from}: ${data.body}`;
                document.getElementById("messages").appendChild(item);
            };

            socket.onerror = () => {
                status.textContent = "WebSocket connection error";
            };

            socket.onclose = (event) => {
                status.textContent = event.reason || "Disconnected";
                sendButton.disabled = true;
                connectButton.disabled = false;
            };
        });

        sendButton.addEventListener("click", () => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                return;
            }

            const recipient = document.getElementById("recipient").value.trim();
            const message = document.getElementById("message").value.trim();

            if (!recipient || !message) {
                alert("Enter a recipient and a message");
                return;
            }

            socket.send(JSON.stringify({
                type: "message",
                to: recipient,
                body: message
            }));

            document.getElementById("message").value = "";
        });
    </script>
</body>

</html>
