
schema {
    query: Query
    mutation: Mutation
    subscription: Subscription
}

type Query {
    health: String
}

type Message {
    id: ID!
    from: String!
    to: String!
    body: String!
    sentAt: AWSDateTime!
}

type Mutation {
    sendMessage(
        to: String!
        body: String!
    ): Message!
}

type Subscription {
    onMessage(to: String!): Message
        @aws_subscribe(mutations: ["sendMessage"])
}
